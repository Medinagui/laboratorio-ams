<!DOCTYPE html>
<!--
  🧪 LABORATÓRIO DO SITE — aula do AMS (27/11/2026)

  Uma página só, sem nada de fora (sem biblioteca, sem CDN, sem fonte
  da internet). Funciona publicada no GitHub Pages e também abrindo o
  arquivo direto do computador ou do pendrive.

  Como funciona, em 3 partes:
    1. CSS (dentro de <style>): a aparência do laboratório.
    2. HTML (dentro de <body>): a barra de botões, a caixa de código
       (<textarea>) e a janelinha do resultado (<iframe>).
    3. JavaScript (dentro de <script>, no fim): pega o que o aluno
       digitou e mostra no <iframe>; pinta o código com cores, como no
       VS Code; guarda no navegador; copia; volta ao modelo.

  O código inicial (o modelo do site) fica escrito DENTRO do <textarea>.
  Ele é uma cópia do site-modelo/index.html, com os sinais < e &
  trocados por &lt; e &amp; (senão o navegador acharia que são etiquetas
  do próprio laboratório). Não edite essa parte à mão: rode
  "node ferramentas/sincronizar-laboratorio.js" na pasta da aula.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratório do site</title>
  <meta name="description" content="Edite o código do seu site e veja o resultado ao vivo. Aula do AMS.">
  <!-- Ícone da aba: um emoji desenhado em SVG, sem arquivo separado. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">

  <style>
    /* Cores da identidade da aula (as mesmas do mural de 23/10). */
    :root {
      --fundo: #14122b;
      --painel: #1f1c3d;
      --borda: #3a3566;
      --texto: #fdfbff;
      --texto-suave: #c9c3ee;
      --amarelo: #ffd93d;
      --verde: #6bcb77;
      --vermelho: #ff6b6b;
      --roxo: #b388ff;
      --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
      --letra-codigo: 17px;   /* tamanho da letra do código */
      --letra-botao: 16px;
    }

    /* Modo TV: tudo maior, para ler de longe. */
    body.tv {
      --letra-codigo: 26px;
      --letra-botao: 22px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font-family: "Mona Sans", "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ----- Barra de cima: título e botões ----- */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--borda);
    }

    h1 {
      margin: 0;
      font-size: calc(var(--letra-botao) * 1.4);
      margin-right: auto;   /* empurra os botões para a direita */
    }

    .botoes { display: flex; flex-wrap: wrap; gap: 8px; }

    button {
      font: inherit;
      font-size: var(--letra-botao);
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 10px;
      border: 2px solid var(--borda);
      background: var(--painel);
      color: var(--texto);
      cursor: pointer;
    }
    button:hover { border-color: var(--roxo); }
    button:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }
    button.principal { background: var(--amarelo); border-color: var(--amarelo); color: #1b1530; }
    button[aria-pressed="true"] { border-color: var(--amarelo); }

    /* ----- As duas metades: código e resultado ----- */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 16px;
      min-height: 0;
    }

    section {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    .rotulo {
      margin: 0 0 6px;
      font-size: var(--letra-botao);
      font-weight: 700;
      color: var(--texto-suave);
    }

    .editor, iframe {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 2px solid var(--borda);
      border-radius: 12px;
    }

    /*
      ----- O editor com cores (igual ao VS Code) -----
      Truque: são DUAS camadas, uma em cima da outra, do mesmo tamanho.
        • Embaixo: <pre id="cores">, com o código colorido.
        • Em cima: o <textarea>, com a letra TRANSPARENTE. A pessoa
          digita nele (e vê o cursor), mas o que aparece são as cores
          da camada de baixo.
      Por isso as duas precisam ter exatamente a mesma letra, o mesmo
      espaçamento e a mesma quebra de linha; senão as letras "descolam".
    */
    .editor {
      position: relative;      /* as camadas se posicionam dentro dele */
      overflow: hidden;
      background: #0f0d22;
      color-scheme: dark;      /* barra de rolagem escura, combinando */
    }
    .editor:focus-within { border-color: var(--roxo); }

    .editor textarea, .editor pre {
      position: absolute;
      inset: 0;                /* ocupa o editor inteiro */
      margin: 0;
      border: 0;
      padding: 12px;
      font-family: var(--mono);
      font-size: var(--letra-codigo);
      line-height: 1.5;
      tab-size: 2;
      white-space: pre-wrap;   /* quebra linhas compridas... */
      overflow-wrap: break-word; /* ...mesmo no meio de "=========" */
      overflow-x: hidden;
      /* As duas reservam o espaço da barra de rolagem, mesmo a de baixo,
         que não mostra barra nenhuma: assim as linhas têm a mesma largura. */
      scrollbar-gutter: stable;
      /* Algumas fontes de código juntam "<!--" ou "=>" num desenho só
         (ligadura). Desligamos para o aluno ver cada sinal que digita. */
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
    }

    .editor pre {
      color: #d4d4d4;          /* texto comum */
      pointer-events: none;    /* cliques atravessam para o textarea */
      overflow-y: hidden;      /* sem barra: quem rola é o textarea, e ela vai junto */
    }

    .editor textarea {
      overflow-y: auto;
      resize: none;
      background: transparent;
      color: transparent;      /* a letra some... */
      caret-color: white;      /* ...mas o cursor continua aparecendo */
      outline: none;
    }
    .editor textarea::selection { background: rgba(90, 169, 255, 0.35); color: transparent; }

    /* As cores de cada pedaço do código (tema escuro do VS Code). */
    .c-comentario { color: #6b6f86; }  /* comentários: cinza, bem apagado */

    /* Botão "Esconder comentários": deixa os comentários quase invisíveis.
       Eles NÃO somem de verdade (as linhas continuam lá), porque a camada
       colorida precisa ter exatamente o mesmo texto do textarea. */
    body.sem-comentarios .c-comentario { opacity: 0.12; }
    .c-sinal      { color: #808080; }  /* < > </ /> */
    .c-tag        { color: #569cd6; }  /* html, p, h1, ul, li... */
    .c-atributo   { color: #9cdcfe; }  /* class, href, lang... */
    .c-texto-attr { color: #ce9178; }  /* "emoji", "https://..." */
    .c-seletor    { color: #d7ba7d; }  /* body, main, .emoji... (CSS) */
    .c-arroba     { color: #c586c0; }  /* @keyframes, @media */
    .c-propriedade{ color: #9cdcfe; }  /* color, background... */
    .c-valor      { color: #ce9178; }  /* red, "Trebuchet MS", #fff8e7... */
    .c-numero     { color: #b5cea8; }  /* 24px, 1.5, 2s, 50%... */
    .c-chave      { color: #ffd700; }  /* { } */

    iframe { background: white; }

    /* ----- Linha de baixo: avisos ----- */
    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px 16px;
      padding: 8px 16px 12px;
      font-size: 14px;
      color: var(--texto-suave);
    }
    body.tv footer { font-size: 18px; }

    #aviso.ok { color: var(--verde); }
    #aviso.erro { color: var(--vermelho); }

    /* Celular ou tela estreita: uma metade embaixo da outra. */
    @media (max-width: 800px) {
      /* Aqui a página pode crescer e rolar, em vez de caber numa tela só. */
      html, body { height: auto; }
      main { grid-template-columns: 1fr; flex: none; }
      .editor, iframe { flex: none; height: 60vh; }
    }
  </style>
</head>

<body>
  <header>
    <h1>🧪 Laboratório do site</h1>
    <div class="botoes">
      <button id="copiar" class="principal" type="button">📋 Copiar código</button>
      <button id="voltar" type="button">↩️ Voltar ao modelo</button>
      <button id="comentarios" type="button" aria-pressed="false">🙈 Esconder comentários</button>
      <button id="letra" type="button" aria-pressed="false">🔍 Letra grande</button>
    </div>
  </header>

  <main>
    <section>
      <label class="rotulo" for="codigo">✏️ Seu código (mude aqui)</label>
      <!--
        O editor tem duas camadas (ver o CSS de .editor):
        <pre id="cores"> embaixo, com o código colorido, e o <textarea>
        transparente em cima, onde a pessoa digita.
        aria-hidden="true" esconde a camada colorida dos leitores de tela
        (ela é só enfeite: o texto de verdade está no textarea).

        O texto inicial do textarea é o modelo do site.
        spellcheck="false" tira o sublinhado vermelho de "erro de português"
        (código não é português!). autocapitalize/autocomplete="off" impedem
        o celular de mudar o que a pessoa digita.
      -->
      <div class="editor">
      <pre id="cores" aria-hidden="true"></pre>
      <textarea id="codigo" spellcheck="false" autocapitalize="off" autocomplete="off">
&lt;!DOCTYPE html>
&lt;!--
  =====================================================================
  🌐 O MEU SITE — modelo da aula do AMS
  =====================================================================

  Este arquivo é o seu site inteiro. Ele tem três partes:

    1. O CSS (dentro de &lt;style>): é a ROUPA do site.
       Cores, letras, tamanhos, cantos arredondados.

    2. O HTML (dentro de &lt;body>): é o ESQUELETO do site.
       Os títulos, os textos e as listas.

    3. O ROBÔ (dentro de &lt;script>, lá no fim): faz o site se
       atualizar sozinho quando você muda alguma coisa, sem F5.
       Não precisa mexer nele.

  Este texto aqui é um COMENTÁRIO: um bilhete para você, que o
  navegador não mostra na página. No HTML, o comentário começa com
  os sinais "menor, exclamação, traço, traço" e termina com
  "traço, traço, maior". No CSS, começa com /* e termina com */.

  🔒 REGRA DE PRIVACIDADE (vale para todo mundo):
     Este site é PÚBLICO: qualquer pessoa na internet pode ver.
     Por isso, fale de um INTERESSE seu (hobby, jogo, time, banda...).
     ✅ Pode: só o seu primeiro nome ou um apelido (e é opcional).
     ❌ Não pode: foto do seu rosto (nem de colegas), nome da escola,
        cidade, telefone, e-mail, endereço ou rede social.
  =====================================================================
-->
&lt;html lang="pt-BR">
&lt;head>
  &lt;!-- "charset" faz os acentos e os emojis aparecerem certinho. -->
  &lt;meta charset="utf-8">

  &lt;!-- Esta linha deixa o site bonito no celular (não precisa mexer). -->
  &lt;meta name="viewport" content="width=device-width, initial-scale=1">

  &lt;!-- ✏️ TROQUE: o texto que aparece na aba do navegador. -->
  &lt;title>Eu curto astronomia&lt;/title>

  &lt;style>
    /*
      ===============================================================
      🎨 CSS = a ROUPA do site
      ===============================================================
      Cada bloco funciona assim:

        quem { propriedade: valor; }

      "quem" diz QUAL parte da página vai mudar (ex.: h1 = o título).
      Dentro das chaves { } vão as mudanças, uma por linha,
      sempre terminando com ponto e vírgula ;

      Cores podem ser escritas em inglês (red, gold, white...)
      ou com um código que começa com # (ex.: #ff7a59).
      Procure "color picker" no Google para achar o código de qualquer cor.
    */


    /* ----- A PÁGINA INTEIRA (o fundo atrás de tudo) ----- */
    body {
      /* ✏️ TROQUE: a cor de fundo da página.
         Aqui é um degradê (uma cor virando outra) de cima para baixo.
         Quer uma cor só? Apague a linha de baixo e escreva, por exemplo:
         background: #1b1b3a;                                          */
      background: linear-gradient(#1b1b3a, #4b2a6b);

      /* ✏️ TROQUE: o tipo de letra do site todo.
         Experimente: Verdana, Georgia, "Courier New", "Comic Sans MS",
         "Trebuchet MS" ou Impact. Se o computador não tiver a primeira,
         ele usa a próxima da lista.                                    */
      font-family: "Trebuchet MS", Verdana, sans-serif;

      /* Espaço entre a borda da tela e o cartão. */
      padding: 24px 16px;

      /* Tira a margem que o navegador põe sozinho. */
      margin: 0;

      /* Faz o fundo cobrir a tela toda, mesmo com pouco texto. */
      min-height: 100vh;
      box-sizing: border-box;
    }


    /* ----- O CARTÃO (a caixa clara no meio, com o conteúdo) ----- */
    main {
      /* ✏️ TROQUE: a cor do cartão. */
      background: #fff8e7;

      /* ✏️ TROQUE: a cor do texto. */
      color: #2b2250;

      /* Espaço entre a borda do cartão e o texto de dentro. */
      padding: 32px 24px;

      /* ✏️ TROQUE: o quanto os cantos são arredondados.
         0px = cantos retos · 40px = bem redondinho.                    */
      border-radius: 24px;

      /* Largura máxima do cartão. No celular ele encolhe sozinho. */
      max-width: 640px;

      /* "auto" nas laterais centraliza o cartão na tela. */
      margin: 24px auto;

      /* Espaço entre as linhas de texto (deixa mais fácil de ler). */
      line-height: 1.5;
    }


    /* ----- O EMOJI GRANDE lá em cima ----- */
    .emoji {
      /* ✏️ TROQUE: o tamanho do emoji. */
      font-size: 80px;
      text-align: center;
      margin: 0;
    }


    /* ----- O TÍTULO PRINCIPAL (h1) ----- */
    h1 {
      /* ✏️ TROQUE: a cor do título. */
      color: #ff7a59;

      /* ✏️ TROQUE: o tamanho do título. */
      font-size: 40px;

      /* center = no meio · left = à esquerda · right = à direita */
      text-align: center;
      margin: 8px 0 16px;

      /* Linhas mais juntinhas quando o título quebra (no celular). */
      line-height: 1.2;
    }


    /* ----- OS PARÁGRAFOS (p) ----- */
    p {
      /* ✏️ TROQUE: o tamanho das letras do texto. */
      font-size: 20px;
    }


    /* ----- OS SUBTÍTULOS ("3 coisas que eu curto", "Quero aprender") ----- */
    .subtitulo {
      /* ✏️ TROQUE: a cor dos subtítulos. */
      color: #6b3fa0;
      font-size: 24px;
      font-weight: bold;
      margin: 32px 0 12px;
    }


    /* ----- A LISTA (ul) ----- */
    ul {
      /* Tira as bolinhas da lista: os emojis já fazem esse papel. */
      list-style: none;
      padding: 0;
    }


    /* ----- CADA ITEM DA LISTA (li) ----- */
    li {
      /* ✏️ TROQUE: a cor da caixinha de cada item. */
      background: #ffe3c2;

      font-size: 20px;
      padding: 12px 16px;
      border-radius: 12px;

      /* Espaço entre um item e outro. */
      margin-bottom: 10px;
    }


    /* ----- O RODAPÉ (a linha pequena no final) ----- */
    .rodape {
      font-size: 16px;
      text-align: center;
      opacity: 0.7;  /* deixa o texto um pouco mais clarinho */
      margin-top: 32px;
    }
  &lt;/style>
&lt;/head>

&lt;body>
  &lt;!--
    =================================================================
    🦴 HTML = o ESQUELETO do site
    =================================================================
    O HTML é feito de "etiquetas" (tags). Cada parte abre e fecha:

      &lt;p>   abre um parágrafo
      &lt;/p>  fecha o parágrafo (repare na barra /)

    O texto que você vê na página fica ENTRE a abertura e o fechamento.
    Troque só o texto e tome cuidado para não apagar os &lt; > nem a /.
  -->

  &lt;!-- &lt;main> é o cartão claro do meio. Tudo do site fica aqui dentro. -->
  &lt;main>

    &lt;!-- ✏️ TROQUE: o emoji que combina com o seu interesse.
         No Windows, aperte a tecla Windows + ponto (.) para abrir os emojis. -->
    &lt;p class="emoji">🔭&lt;/p>

    &lt;!-- ✏️ TROQUE: o título do seu site. &lt;h1> é o título principal. -->
    &lt;h1>Eu curto astronomia&lt;/h1>

    &lt;!-- ✏️ TROQUE: uma ou duas frases contando sobre o seu interesse. -->
    &lt;p>
      Eu adoro olhar o céu à noite. Gosto de descobrir
      o nome das estrelas e de imaginar como seria viajar até outro planeta.
    &lt;/p>

    &lt;!-- ✏️ TROQUE: o subtítulo da lista. -->
    &lt;p class="subtitulo">3 coisas que eu curto&lt;/p>

    &lt;!-- &lt;ul> é uma lista. Cada &lt;li> é um item dela.
         ✏️ TROQUE o texto de cada item. Quer mais um item?
         Copie uma linha inteira de &lt;li> até &lt;/li> e cole embaixo. -->
    &lt;ul>
      &lt;li>🪐 Ver os anéis de Saturno no telescópio&lt;/li>
      &lt;li>🌑 Acompanhar as fases da Lua&lt;/li>
      &lt;li>🚀 Assistir a lançamentos de foguetes ao vivo&lt;/li>
    &lt;/ul>

    &lt;!-- ✏️ TROQUE: mais uma parte do site, com um subtítulo e um texto. -->
    &lt;p class="subtitulo">Quero aprender&lt;/p>
    &lt;p>
      Um dia quero criar um aplicativo que mostra quais planetas
      dá para ver no céu em cada noite.
    &lt;/p>

    &lt;!-- ✏️ TROQUE: o seu PRIMEIRO NOME ou um apelido. Também pode apagar.
         🔒 Nada de sobrenome, escola, cidade ou contato. -->
    &lt;p class="rodape">Feito com HTML e CSS por Astro ✨&lt;/p>

  &lt;/main>

  &lt;!--
    🤖 O ROBÔ QUE ATUALIZA SOZINHO (não precisa mexer nem apagar)

    Isto é JavaScript, a terceira linguagem da web: ela dá COMPORTAMENTO
    para a página. De 10 em 10 segundos, o robô pergunta para o GitHub
    se o seu site mudou. Se mudou, ele recarrega a página sozinho.
    Assim, depois do commit, é só esperar: não precisa apertar F5.

    No laboratório o robô fica parado (lá o resultado já muda na hora).
  -->
  &lt;script>
    // Aqui o robô guarda o seu site do jeito que ele está agora.
    let versaoGuardada = null;

    // A tarefa do robô: buscar o site de novo e comparar.
    async function conferir() {
      try {
        // Pede o site ao GitHub, sem usar a cópia velha do navegador.
        const resposta = await fetch(location.pathname + '?robo=' + Date.now(), { cache: 'no-store' });
        const versaoNova = await resposta.text();

        if (versaoGuardada === null) {
          versaoGuardada = versaoNova;   // primeira vez: só guarda
        } else if (versaoNova !== versaoGuardada) {
          location.reload();             // mudou: recarrega a página
        }
      } catch (erro) {
        // Sem internet agora? Tudo bem: tenta de novo daqui a pouco.
      }
    }

    // Só liga o robô quando o site está no ar (endereço com http).
    if (location.protocol.startsWith('http')) {
      conferir();
      setInterval(conferir, 10000);    // 10000 milissegundos = 10 segundos
    }
  &lt;/script>
&lt;/body>
&lt;/html>
</textarea>
      </div>
    </section>

    <section>
      <p class="rotulo" id="rotulo-resultado">👀 Resultado ao vivo</p>
      <!--
        <iframe> é uma "janelinha" com outra página dentro.
        sandbox = caixa de areia: a página de dentro não pode rodar
        JavaScript (o site do aluno não usa) e não mexe no laboratório.
        allow-same-origin deixa o laboratório lembrar onde a janelinha
        estava rolada; allow-popups deixa os links abrirem em outra aba.
      -->
      <iframe id="resultado" title="Resultado ao vivo do seu site" aria-labelledby="rotulo-resultado"
              sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
    </section>
  </main>

  <footer>
    <span id="aviso" role="status"></span>
    <span>Aula do AMS · Guilherme Medina (Thompson Tecnologia)</span>
  </footer>

  <script>
    // =================================================================
    // PARTE 1 — guardar e recuperar no navegador (localStorage)
    // =================================================================
    // localStorage é uma "gavetinha" do navegador: guarda texto mesmo
    // depois de fechar a página. Mas às vezes ela está trancada (aba
    // anônima, computador da escola com bloqueio). Por isso tudo aqui
    // fica dentro de try/catch: se der erro, o laboratório continua
    // funcionando, só não guarda.

    const CHAVE_CODIGO = 'laboratorio-ams:codigo';
    const CHAVE_LETRA = 'laboratorio-ams:letra-grande';
    const CHAVE_COMENTARIOS = 'laboratorio-ams:sem-comentarios';

    // Devolve a gavetinha, ou null se o navegador não deixar usar.
    function pegarArmazenamento() {
      try {
        return window.localStorage;
      } catch (erro) {
        return null;
      }
    }

    // Lê um valor guardado. Devolve null se não tiver nada ou se falhar.
    function lerSalvo(armazenamento, chave) {
      if (!armazenamento) return null;
      try {
        return armazenamento.getItem(chave);
      } catch (erro) {
        return null;
      }
    }

    // Guarda um valor. Devolve true se deu certo e false se falhou.
    function salvar(armazenamento, chave, valor) {
      if (!armazenamento) return false;
      try {
        armazenamento.setItem(chave, valor);
        return true;
      } catch (erro) {
        return false;
      }
    }

    // Apaga um valor guardado (usado no "Voltar ao modelo").
    function apagarSalvo(armazenamento, chave) {
      if (!armazenamento) return;
      try {
        armazenamento.removeItem(chave);
      } catch (erro) {
        // não tinha como apagar: tudo bem
      }
    }

    // Decide qual código mostrar ao abrir: o guardado, se existir;
    // senão, o modelo.
    function codigoInicial(salvo, modelo) {
      return salvo === null ? modelo : salvo;
    }

    // =================================================================
    // PARTE 2 — pintar o código com cores (como o VS Code)
    // =================================================================
    // A função colorir() lê o código do começo ao fim, como quem lê um
    // livro, e vai separando os pedaços: comentário, etiqueta (tag),
    // atributo, texto... Cada pedaço vira um <span class="c-...">, e o
    // CSS dá a cor de cada classe.
    // Regra de ouro: ela NUNCA muda, tira ou acrescenta letras, só
    // embrulha. Senão a camada colorida descola do que foi digitado.

    // Troca os sinais que o navegador entenderia como etiqueta.
    function escaparHtml(texto) {
      return texto.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Embrulha um pedaço de texto num <span> com a classe da cor.
    function pintar(classe, texto) {
      if (!texto) return '';
      if (!classe) return escaparHtml(texto);   // sem cor especial
      return '<span class="' + classe + '">' + escaparHtml(texto) + '</span>';
    }

    // Pinta um código HTML inteiro (e o CSS que estiver dentro de <style>).
    function colorir(codigo) {
      let saida = '';
      let i = 0;   // i = onde estamos lendo agora
      // Uma etiqueta: "<" ou "</", o nome (p, h1, !DOCTYPE...), o resto até ">".
      const ETIQUETA = /<(\/?)(![A-Za-z]+|[A-Za-z][\w-]*)([^<>]*)(>?)/y;

      while (i < codigo.length) {
        // 1) Comentário <!-- ... --> (se não fechar, vai até o fim)
        if (codigo.startsWith('<!--', i)) {
          let fim = codigo.indexOf('-->', i + 4);
          fim = fim === -1 ? codigo.length : fim + 3;
          saida += pintar('c-comentario', codigo.slice(i, fim));
          i = fim;
          continue;
        }

        // 2) Etiqueta, tipo <p class="emoji"> ou </main>
        ETIQUETA.lastIndex = i;
        const achou = ETIQUETA.exec(codigo);
        if (achou) {
          const [tudo, barra, nome, resto, fecha] = achou;
          saida += pintar('c-sinal', '<' + barra) + pintar('c-tag', nome) +
                   colorirAtributos(resto) + pintar('c-sinal', fecha);
          i += tudo.length;

          // Abriu um <style>? Até o </style>, o código é CSS.
          if (!barra && nome.toLowerCase() === 'style' && fecha) {
            let fimCss = codigo.toLowerCase().indexOf('</style', i);
            if (fimCss === -1) fimCss = codigo.length;
            saida += colorirCss(codigo.slice(i, fimCss));
            i = fimCss;
          }
          continue;
        }

        // 3) Texto comum: vai até o próximo "<"
        let fim = codigo.indexOf('<', i + 1);
        if (fim === -1) fim = codigo.length;
        saida += escaparHtml(codigo.slice(i, fim));
        i = fim;
      }
      return saida;
    }

    // Pinta o miolo de uma etiqueta:  class="emoji"  ou  lang="pt-BR"
    function colorirAtributos(texto) {
      // Cada volta pega: um texto entre aspas, OU um nome, OU um sinal/espaço.
      return texto.replace(/("[^"]*"?|'[^']*'?)|([^\s="'\/]+)|(\s+|[\s\S])/g,
        function (_, aspas, nome, outro) {
          if (aspas) return pintar('c-texto-attr', aspas);
          if (nome) return pintar('c-atributo', nome);
          return pintar(outro === '=' || outro === '/' ? 'c-sinal' : '', outro);
        });
    }

    // Pinta um trecho de CSS:  seletor { propriedade: valor; }
    function colorirCss(css) {
      let saida = '';
      let i = 0;
      while (i < css.length) {
        // Comentário /* ... */
        if (css.startsWith('/*', i)) {
          let fim = css.indexOf('*/', i + 2);
          fim = fim === -1 ? css.length : fim + 2;
          saida += pintar('c-comentario', css.slice(i, fim));
          i = fim;
          continue;
        }
        // Chaves e ponto e vírgula
        if ('{};'.includes(css[i])) {
          saida += pintar(css[i] === ';' ? '' : 'c-chave', css[i]);
          i++;
          continue;
        }
        // Lê até o próximo { } ; ou comentário e decide o que é.
        const distancia = css.slice(i).search(/[{};]|\/\*/);
        const fim = distancia === -1 ? css.length : i + distancia;
        const trecho = css.slice(i, fim);
        if (css[fim] === '{') {
          // vem antes de "{": é um seletor (body, .emoji, @keyframes pular, 50%)
          saida += trecho.replace(/(@[\w-]+)|([^@]+)/g, function (_, arroba, resto) {
            return arroba ? pintar('c-arroba', arroba) : pintar('c-seletor', resto);
          });
        } else if (trecho.includes(':')) {
          // propriedade: valor
          const doisPontos = trecho.indexOf(':');
          saida += pintar('c-propriedade', trecho.slice(0, doisPontos)) + ':' +
                   colorirValor(trecho.slice(doisPontos + 1));
        } else {
          saida += escaparHtml(trecho);   // só espaços e quebras de linha
        }
        i = fim;
      }
      return saida;
    }

    // Pinta um valor de CSS: números (24px, 1.5, 2s) de verde, o resto
    // de laranja. Cores com # (ex.: #fff8e7) ficam laranja inteiras,
    // senão os números do meio delas sairiam verdes.
    function colorirValor(valor) {
      return valor.replace(/(#[0-9a-fA-F]+)|(-?\d*\.?\d+(?:px|em|rem|s|ms|vh|vw|%|deg|fr)?)|([^\d.#-]+|[\s\S])/g,
        function (_, cor, numero, resto) {
          return numero ? pintar('c-numero', numero) : pintar('c-valor', cor || resto);
        });
    }

    // =================================================================
    // PARTE 3 — ligar os botões e a caixa de código na página
    // =================================================================
    // Este "if" só existe por causa dos testes automáticos: eles rodam as
    // PARTES 1 e 2 no Node.js, onde não existe página (document). No
    // navegador ele é sempre verdadeiro.
    if (typeof document !== 'undefined') {
      const caixa = document.getElementById('codigo');
      const cores = document.getElementById('cores');
      const janela = document.getElementById('resultado');
      const aviso = document.getElementById('aviso');
      const botaoLetra = document.getElementById('letra');
      const armazenamento = pegarArmazenamento();

      // O modelo é o texto que veio escrito dentro do <textarea>.
      // "defaultValue" é esse texto original, mesmo depois de editar.
      const MODELO = caixa.defaultValue;

      // Escreve um aviso na linha de baixo. tipo = 'ok' (verde) ou 'erro' (vermelho).
      function avisar(texto, tipo) {
        aviso.textContent = texto;
        aviso.className = tipo || '';
      }

      // ----- Pintar o código -----
      // Redesenha a camada colorida com o que está no textarea.
      // O "\n" no fim é porque o <pre> ignora uma última linha vazia,
      // e aí as camadas descolariam quando o código termina com Enter.
      function atualizarCores() {
        cores.innerHTML = colorir(caixa.value) + '\n';
        acompanharRolagem();
      }

      // Quando o textarea rola, a camada colorida rola junto.
      function acompanharRolagem() {
        cores.scrollTop = caixa.scrollTop;
        cores.scrollLeft = caixa.scrollLeft;
      }
      caixa.addEventListener('scroll', acompanharRolagem);

      // ----- Mostrar o resultado -----
      // srcdoc = "o código desta janelinha é este texto aqui".
      // Antes de trocar, anotamos onde ela estava rolada, para não
      // voltar ao topo a cada letra digitada.
      let rolagem = 0;
      function mostrarResultado() {
        try {
          rolagem = janela.contentWindow.scrollY;
        } catch (erro) {
          rolagem = 0;
        }
        janela.srcdoc = caixa.value;
      }

      // Quando a janelinha termina de carregar:
      janela.addEventListener('load', function () {
        try {
          // volta para onde estava rolada...
          janela.contentWindow.scrollTo(0, rolagem);
          // ...e faz os links abrirem em outra aba, para o laboratório
          // não sumir de dentro da janelinha.
          for (const link of janela.contentDocument.querySelectorAll('a')) {
            link.target = '_blank';
          }
        } catch (erro) {
          // se o navegador não deixar, só fica sem esses detalhes
        }
      });

      // ----- Guardar e atualizar enquanto digita -----
      // As cores mudam na hora (senão a letra digitada ficaria invisível).
      // Já o resultado espera o aluno parar de digitar por 0,3 segundo
      // antes de redesenhar (senão a janelinha piscaria a cada tecla).
      let espera = null;
      caixa.addEventListener('input', function () {
        atualizarCores();
        const guardou = salvar(armazenamento, CHAVE_CODIGO, caixa.value);
        avisar(guardou
          ? '✅ Guardado neste navegador'
          : '⚠️ Este navegador não deixa guardar: copie o código antes de fechar a página', guardou ? 'ok' : 'erro');
        clearTimeout(espera);
        espera = setTimeout(mostrarResultado, 300);
      });

      // ----- Botão "Copiar código" -----
      // Jeito novo: navigator.clipboard (a área de transferência).
      // Se o navegador não deixar, tentamos o jeito antigo
      // (selecionar o texto e mandar copiar). Se nem isso der,
      // deixamos tudo selecionado e pedimos Ctrl+C.
      function copiarJeitoAntigo() {
        caixa.focus();
        caixa.select();
        try {
          if (document.execCommand('copy')) {
            avisar('📋 Copiado! Agora cole no index.html lá no GitHub (Ctrl+V)', 'ok');
            return;
          }
        } catch (erro) {
          // cai no aviso abaixo
        }
        avisar('⚠️ Não consegui copiar sozinho. O código está selecionado: aperte Ctrl+C', 'erro');
      }

      document.getElementById('copiar').addEventListener('click', function () {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(caixa.value).then(
            function () { avisar('📋 Copiado! Agora cole no index.html lá no GitHub (Ctrl+V)', 'ok'); },
            copiarJeitoAntigo
          );
        } else {
          copiarJeitoAntigo();
        }
      });

      // ----- Botão "Voltar ao modelo" -----
      document.getElementById('voltar').addEventListener('click', function () {
        const certeza = confirm('Isso apaga tudo o que você mudou e volta ao código do modelo.\n\nTem certeza?');
        if (!certeza) return;
        caixa.value = MODELO;
        caixa.scrollTop = 0;
        atualizarCores();
        apagarSalvo(armazenamento, CHAVE_CODIGO);
        rolagem = 0;
        janela.srcdoc = MODELO;
        avisar('↩️ Voltou ao modelo', 'ok');
      });

      // ----- Botão "Letra grande" (para a TV) -----
      // Também liga sozinho se o endereço terminar com ?tv
      function ligarLetraGrande(ligado) {
        document.body.classList.toggle('tv', ligado);
        botaoLetra.setAttribute('aria-pressed', String(ligado));
      }
      botaoLetra.addEventListener('click', function () {
        const ligado = !document.body.classList.contains('tv');
        ligarLetraGrande(ligado);
        salvar(armazenamento, CHAVE_LETRA, ligado ? 'sim' : 'nao');
      });

      // ----- Botão "Esconder comentários" -----
      // Só muda a aparência (ver o CSS de body.sem-comentarios):
      // o código continua igual, e o "Copiar" leva os comentários junto.
      const botaoComentarios = document.getElementById('comentarios');
      function esconderComentarios(esconder) {
        document.body.classList.toggle('sem-comentarios', esconder);
        botaoComentarios.setAttribute('aria-pressed', String(esconder));
        botaoComentarios.textContent = esconder ? '🙉 Mostrar comentários' : '🙈 Esconder comentários';
      }
      botaoComentarios.addEventListener('click', function () {
        const esconder = !document.body.classList.contains('sem-comentarios');
        esconderComentarios(esconder);
        salvar(armazenamento, CHAVE_COMENTARIOS, esconder ? 'sim' : 'nao');
      });

      // ----- Ao abrir a página -----
      esconderComentarios(lerSalvo(armazenamento, CHAVE_COMENTARIOS) === 'sim');
      caixa.value = codigoInicial(lerSalvo(armazenamento, CHAVE_CODIGO), MODELO);
      atualizarCores();
      ligarLetraGrande(new URLSearchParams(location.search).has('tv') ||
                       lerSalvo(armazenamento, CHAVE_LETRA) === 'sim');
      if (!armazenamento) {
        avisar('⚠️ Este navegador não deixa guardar: copie o código antes de fechar a página', 'erro');
      }
      janela.srcdoc = caixa.value;
    }
  </script>
</body>
</html>
